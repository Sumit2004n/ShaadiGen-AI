services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shaadigen
      POSTGRES_PASSWORD: shaadigen
      POSTGRES_DB: shaadigen
    ports:
      - "5432:5432"
    volumes:
      - shaadigen_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shaadigen -d shaadigen"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../shaadigen-backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: local
      DEBUG: "true"
      SECRET_KEY: local-dev-secret-key-change-me
      DATABASE_URL: postgresql+asyncpg://shaadigen:shaadigen@postgres:5432/shaadigen
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn shaadigen.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ../shaadigen-backend/src:/app/src
      - ../shaadigen-backend/alembic:/app/alembic

  worker:
    build:
      context: ../shaadigen-backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: local
      SECRET_KEY: local-dev-secret-key-change-me
      DATABASE_URL: postgresql+asyncpg://shaadigen:shaadigen@postgres:5432/shaadigen
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A shaadigen.infrastructure.celery.app.celery_app worker --loglevel=INFO
    volumes:
      - ../shaadigen-backend/src:/app/src

volumes:
  shaadigen_pg:
